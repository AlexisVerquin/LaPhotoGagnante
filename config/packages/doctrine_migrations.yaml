doctrine_migrations:
    migrations_paths:
        # namespace is arbitrary but should be different from App\Migrations
        # as migrations classes should NOT be autoloaded
        'DoctrineMigrations': '%kernel.project_dir%/migrations'
    enable_profiler: false
    # MySQL valide implicitement chaque ordre DDL (CREATE/ALTER) : une transaction englobante
    # ne protège rien et déclenche un avertissement de dépréciation.
    transactional: false
