framework:
    asset_mapper:
        # The paths to make available to the asset mapper.
        paths:
            - assets/
        missing_import_mode: strict
        # Pas de script de compatibilité chargé depuis un CDN (ga.jspm.io) :
        # tous les navigateurs actuels gèrent les import maps.
        importmap_polyfill: false

when@prod:
    framework:
        asset_mapper:
            missing_import_mode: warn
