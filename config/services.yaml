# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    locale: 'en'
    # Valeurs par défaut, à changer dans .env.local ou dans l'environnement.
    env(MAILER_FROM): 'LaPhotoGagnante <no-reply@laphotogagnante.fr>'
    env(ADMIN_MAIL): 'alexis.verquin@gmail.com'
    app.admin_email: '%env(ADMIN_MAIL)%'
    # Coordonnées privées affichées dans les mentions légales, renseignées hors de git (vide = « À compléter »)
    env(LEGAL_EDITOR_ADDRESS): ''
    env(LEGAL_HOST_ADDRESS): ''
    env(LEGAL_HOST_PHONE): ''
    # Âge minimum pour s'inscrire (15 ans = majorité numérique en France), repris dans les CGU
    app.min_age: 15
    # Adresse publique du site : liens des emails, canonical, sitemap. Seul ce domaine est indexé par les moteurs.
    app.site_url: 'https://laphotogagnante.fr'
    # Laissés vides, les boutons Google / Facebook n'apparaissent pas.
    env(OAUTH_GOOGLE_CLIENT_ID): ''
    env(OAUTH_GOOGLE_CLIENT_SECRET): ''
    env(OAUTH_FACEBOOK_CLIENT_ID): ''
    env(OAUTH_FACEBOOK_CLIENT_SECRET): ''
    # Les photos en attente restent hors du dossier web jusqu'à leur validation.
    app.pending_photos_dir: '%kernel.project_dir%/storage/pending'
    app.public_photos_dir: '%kernel.project_dir%/public/uploads/themes'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        autowire: true
        autoconfigure: true

    App\EventSubscriber\LocaleSubscriber:
        arguments:
            $defaultLocale: '%locale%'
            $availableLocales: [ 'en', 'fr' ]

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
