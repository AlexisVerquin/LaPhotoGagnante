name: Déploiement

# Met le site à jour dès que la CI passe sur main.
# On peut aussi le relancer à la main depuis l'onglet Actions.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois, et on n'interrompt jamais celui qui tourne.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Production (serveur maison)
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # Le runner installé sur le serveur maison (cf. deploy/README.md).
    runs-on: [self-hosted, photoprix]
    environment:
      name: production
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # Exactement le commit que la CI vient de valider.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Déployer
        run: ./deploy/deploy.sh
        env:
          PHOTOPRIX_ENV_FILE: /srv/photoprix/.env.prod
          PHOTOPRIX_BACKUP_DIR: /srv/photoprix/backups
