name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

# Un nouveau push annule la CI encore en cours sur la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_EXTENSIONS: ctype, iconv, intl, mbstring, pdo_mysql, gd, exif, amqp, zip, xsl
  # Des valeurs bidon : la CI n'a besoin d'aucun vrai secret.
  APP_SECRET: ci-not-a-real-secret

jobs:
  quality:
    name: Qualité (lint, PHPStan, style, sécurité)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # Le .env n'est pas dans git, on part de l'exemple.
      - run: cp .env.example .env

      - run: composer install --no-interaction --no-progress --prefer-dist

      # Le même script qu'en local avec bin/ci : la liste des vérifications est dans bin/ci-checks.
      - name: Vérifications (composer, style, PHPStan, lints)
        run: bin/ci-checks quality

  docker:
    name: Image de production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # On construit l'image comme sur le serveur, pour qu'un Dockerfile cassé se voie avant le déploiement.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # Une variable d'environnement passe devant ce qui est écrit dans .env.test.
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/app?serverVersion=8.4.0&charset=utf8mb4

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: cp .env.example .env
      - run: composer install --no-interaction --no-progress --prefer-dist

      # La base de test est recréée à partir des migrations à chaque lancement.
      - name: Tests (PHPUnit)
        run: bin/ci-checks tests
