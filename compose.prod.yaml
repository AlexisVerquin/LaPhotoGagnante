# La production, lancée par deploy/deploy.sh (à la main, toujours avec --env-file /srv/photoprix/.env.prod).
# Aucun port ouvert : tout passe par le tunnel Cloudflare, et les données vivent dans des volumes qui survivent aux déploiements.

name: photoprix-prod

# Journaux tournants : quelques Mo par service au plus, jamais conservés indéfiniment
x-logging: &logging
    driver: json-file
    options:
        max-size: '10m'
        max-file: '3'

x-app: &app
    logging: *logging
    image: photoprix-app:latest
    restart: unless-stopped
    env_file:
        - ${PHOTOPRIX_ENV_FILE:-/srv/photoprix/.env.prod}
    networks:
        - internal

services:
    php:
        <<: *app
        build:
            context: .
            target: prod
        volumes:
            - uploads:/app/public/uploads
            - pending_photos:/app/storage
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            database:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy

    messenger:
        <<: *app
        # Envoie les emails en arrière-plan, et redémarre toutes les heures pour repartir à neuf.
        command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M
        healthcheck:
            disable: true
        depends_on:
            database:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy

    database:
        image: mysql:8.4
        logging: *logging
        restart: unless-stopped
        env_file:
            - ${PHOTOPRIX_ENV_FILE:-/srv/photoprix/.env.prod}
        volumes:
            - database_data:/var/lib/mysql
        healthcheck:
            # 127.0.0.1 (réseau) et pas localhost (socket) : au premier démarrage, MySQL lance d'abord un serveur
            # temporaire sans réseau pour s'initialiser, qui répondrait au socket alors qu'il n'est pas encore prêt
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 30s
        networks:
            - internal

    rabbitmq:
        image: rabbitmq:4-alpine
        logging: *logging
        restart: unless-stopped
        env_file:
            - ${PHOTOPRIX_ENV_FILE:-/srv/photoprix/.env.prod}
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10
        networks:
            - internal

    cloudflared:
        logging: *logging
        # Relie https://laphotogagnante.fr au site, sans ouvrir de port.
        image: cloudflare/cloudflared:latest
        restart: unless-stopped
        command: tunnel --no-autoupdate run
        environment:
            TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Renseignez CLOUDFLARE_TUNNEL_TOKEN dans le fichier .env.prod}
        depends_on:
            - php
        networks:
            - internal

volumes:
    database_data:
    rabbitmq_data:
    uploads:
    pending_photos:
    caddy_data:
    caddy_config:

networks:
    internal:
